[package]
name = "ek-rs"
description = "Optional native kernels for ek, built by maturin as the ek_rs extension module"
version = "0.0.1"          # SSOT is rust/py/pyproject.toml [project].version; keep equal
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ek_rs"            # must match [tool.maturin] module-name and the #[pymodule] name
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
rover-align = { path = "../core" }

[lints]
workspace = true
