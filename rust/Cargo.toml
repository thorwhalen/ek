# Cargo workspace for the optional Rust half of ek (see misc/docs/port-log.md).
# rust/core: rover-align, pure Rust (no PyO3), tested with `cargo test -p rover-align`.
# rust/py:   ek-rs, the binding cdylib built by maturin into the `ek_rs` extension module,
#            shipped as the separate, optional `ek-rs` wheel (`pip install ek[rust]`).
# ek itself stays a pure-Python (hatchling) package: nothing here is in its wheel.
[workspace]
resolver = "3"
members = ["core", "py"]

[workspace.package]
version = "0.0.0"      # not a release version; see each crate
edition = "2024"
rust-version = "1.85"  # PyO3 0.30's MSRV; also the floor for users building from the sdist
publish = false
license = "MIT"        # same licence as ek (pyproject.toml [project].license)
repository = "https://github.com/thorwhalen/ek"

[workspace.dependencies]
# abi3-py310: one wheel per platform for CPython >= 3.10. No "extension-module" feature:
# maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE itself, and the feature breaks cargo test.
pyo3 = { version = "0.30", features = ["abi3-py310"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Never panic = "abort": PyO3 turns a Rust panic into PanicException only when unwinding.
